name: Add unigram

on:
  issues:
    types:
      - opened
      - edited
      - reopened

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  propose:
    name: Check report and propose PR
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'Add unigram') || startsWith(github.event.issue.title, '缺詞回報')

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install release dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libsqlite3-dev opencc

      - name: Build normalized lexicon
        run: cargo run --release -- prepare-release

      - name: Process missing word report
        id: report
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          MISSING_WORD_OUT_DIR: ${{ runner.temp }}/missing-word
        run: node scripts/lexicon/process-missing-word-issue.mjs

      - name: Comment on issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f "${{ runner.temp }}/missing-word/comment.md" ]; then
            gh issue comment "${{ github.event.issue.number }}" --body-file "${{ runner.temp }}/missing-word/comment.md"
          fi
        if: always()

      - name: Create pull request
        if: steps.report.outputs.should_pr == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ github.token }}
          branch: bot/missing-word-${{ github.event.issue.number }}
          delete-branch: true
          title: ${{ steps.report.outputs.pr_title }}
          body-path: ${{ runner.temp }}/missing-word/pr-body.md
          commit-message: ${{ steps.report.outputs.commit_message }}
          add-paths: sources/chiaki-modern-overlay/unigrams.tsv
          labels: |
            Add unigram
